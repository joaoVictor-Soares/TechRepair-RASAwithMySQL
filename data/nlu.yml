version: "3.1"

nlu:
  - intent: greet
    examples: |
      - Olá
      - Oi
      - Bom dia
      - Boa tarde
      - Olá, tem alguém aí?
      - Alô

  - intent: goodbye
    examples: |
      - Tchau
      - Adeus
      - Até mais
      - Obrigado pela ajuda, tchau
      - Encerrar atendimento

  - intent: abrir_chamado
    examples: |
      - Quero cadastrar um aparelho para conserto
      - Preciso abrir um chamado
      - Meu celular quebrou e quero consertar
      - Como faço para mandar meu telefone pro conserto?
      - Gostaria de abrir uma ordem de serviço

  - intent: consultar_status
    examples: |
      - Como está o meu conserto?
      - Quero consultar o status do meu reparo
      - Ver status da minha ordem de serviço
      - O meu aparelho já tá pronto?
      - Quero saber o andamento do meu conserto

  - intent: atualizar_email
    examples: |
      - Quero mudar meu e-mail de contato.
      - Preciso atualizar meu e-mail
      - Alterar o endereço de email do meu cadastro
      - Mudar meu email cadastrado
      - Atualizar dados de contato

  - intent: inform
    examples: |
      - Meu nome é [Carlos](nome)
      - Meu telefone é [11999999999](telefone)
      - É um [iPhone 13](modelo)
      - O problema é que [a tela quebrou](problema)
      - Meu novo email é [teste@email.com](novo_email)
      - O ID da ordem é [7](id_ordem)
      - [9999](id_ordem)
      - [Marcos](nome)
      - [Galaxy S23](modelo)
      - [Não liga](problema)