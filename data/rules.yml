version: "3.1"

rules:
  - rule: Responder Saudação Inicial
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Responder Despedida
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Ativação do Formulário de Cadastro
    steps:
      - intent: abrir_chamado
      - action: form_abrir_chamado
      - active_loop: form_abrir_chamado

  - rule: Ativação do Formulário de Status
    steps:
      - intent: consultar_status
      - action: form_consultar_status
      - active_loop: form_consultar_status

  - rule: Ativação do Formulário de Email
    steps:
      - intent: atualizar_email
      - action: form_atualizar_email
      - active_loop: form_atualizar_email